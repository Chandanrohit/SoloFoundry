site_name: SoloFoundry
site_description: Evidence-led guides for independent builders taking products from problem to operation.
site_url: https://chandanrohit.github.io/SoloFoundry/
repo_url: https://github.com/Chandanrohit/SoloFoundry
repo_name: Chandanrohit/SoloFoundry
edit_uri: edit/main/
docs_dir: .
site_dir: site
strict: true
use_directory_urls: true

exclude_docs: |
  /site/
  /scripts/
  /.github/
  /mkdocs.yml
  /requirements-docs.txt
  /tests/

theme:
  name: material
  language: en
  logo: assets/brand/solofoundry-mark.svg
  favicon: assets/brand/solofoundry-mark.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
extra_css:
  - assets/brand/site.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - Start here:
      - Foundations: 00-foundations/README.md
      - Discover:
          - Overview: 01-discover/README.md
          - Problem discovery: 01-discover/problem-discovery/README.md
          - Customer research: 01-discover/customer-research/README.md
          - Jobs and workflows: 01-discover/jobs-and-workflows/README.md
          - Market intelligence: 01-discover/market-intelligence/README.md
          - Assumptions and evidence: 01-discover/assumptions-and-evidence/README.md
          - Synthesis and decisions: 01-discover/synthesis-and-decisions/README.md
          - Validation: 01-discover/validation/README.md
          - Worked example: 01-discover/worked-example/README.md
      - Design:
